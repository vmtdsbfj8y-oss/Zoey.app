<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #out { display: block; }
</style>

<canvas id="out"></canvas>

<script>
/*
 * THE DASHBOARD'S COSMIC BACKGROUND.
 *
 * This paints ONLY the environment -- stars, dust, nebula, planets, orbital arcs. No score, no
 * bureau name, no date, no button, no character. Nothing dynamic is baked in, because the moment a
 * live value is painted into an asset it stops being a background and becomes a stale screenshot.
 *
 * ==============================  WHY IT IS PAINTED, NOT DRAWN AT RUNTIME  ==============================
 *
 * The previous version built this scene from react-native-svg primitives: one gradient ellipse for a
 * nebula, a circle with two darker circles on it for a moon, one stroked ellipse for an orbit. Those
 * are the right shapes and the wrong medium. A nebula is not an ellipse with a soft edge -- it is
 * dozens of overlapping blurred masses at different densities, which is cheap on a canvas with a
 * blur filter and impossible with a handful of vector nodes. The result read as flat fills and thin
 * outlines rather than as depth.
 *
 * ==============================  IT IS DETERMINISTIC  ==============================
 *
 * Every random draw comes from a seeded PRNG, so re-running this produces a byte-identical file.
 * `Math.random` would make the asset unreproducible and any future diff meaningless.
 *
 * ==============================  THE LEFT SIDE STAYS DARK ON PURPOSE  ==============================
 *
 * The score chamber sits over the upper left and the report copy under it. Every bright mass here is
 * placed right-of-centre or low, so the numerals keep their contrast. `BRIGHT_KEEPOUT` is the region
 * the luminous passes are actively pushed out of.
 */

const W = WIDTH_PX;
const H = HEIGHT_PX;

/* The chamber + copy occupy this box in normalized coords. Bright masses are attenuated inside it. */
const BRIGHT_KEEPOUT = { x0: 0.00, y0: 0.06, x1: 0.58, y1: 0.82 };

/** mulberry32 -- small, fast, and seedable so the asset is reproducible. */
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = rng(0x5A0E17);
const between = (a, b) => a + rand() * (b - a);

/** How much a point is inside the protected box, 0 outside .. 1 well inside. */
function keepoutWeight(nx, ny) {
  const k = BRIGHT_KEEPOUT;
  if (nx < k.x0 || nx > k.x1 || ny < k.y0 || ny > k.y1) return 0;
  const dx = Math.min(nx - k.x0, k.x1 - nx) / ((k.x1 - k.x0) / 2);
  const dy = Math.min(ny - k.y0, k.y1 - ny) / ((k.y1 - k.y0) / 2);
  return Math.min(1, Math.min(dx, dy) * 1.6);
}

const canvas = document.getElementById('out');
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext('2d', { willReadFrequently: true });

/* ------------------------------------------------------------------ 1. base tone
 * Not one flat fill. Three broad radial washes at different centres give the field a tonal drift so
 * that even the "empty" regions are not the same colour twice.
 */
ctx.fillStyle = '#07030F';
ctx.fillRect(0, 0, W, H);

function wash(cx, cy, r, color, alpha) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = alpha;
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}
ctx.globalCompositeOperation = 'lighter';
wash(W * 0.94, H * 0.70, W * 0.62, 'rgba(72, 28, 134, 1)', 0.40);
wash(W * 0.22, H * 0.16, W * 0.62, 'rgba(30, 14, 64, 1)', 0.26);
wash(W * 0.60, H * 1.00, W * 0.50, 'rgba(44, 18, 88, 1)', 0.20);
ctx.globalCompositeOperation = 'source-over';

/* ------------------------------------------------------------------ 2. nebula
 * Layered blurred masses. Each cloud is a cluster of blobs rather than one shape, which is what
 * gives it internal structure instead of a smooth falloff.
 */
function nebulaCloud(cx, cy, spread, tint, alpha, blobs, blur, angle, elong) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.filter = `blur(${blur}px)`;
  for (let i = 0; i < blobs; i += 1) {
    /* Distributed along a rotated axis, not in a disc: a galaxy is a sweep, and a radially even
       cluster of blobs can only ever be a ball. */
    const a = between(0, Math.PI * 2);
    const d = Math.pow(rand(), 0.7) * spread;
    const ux = Math.cos(a) * d * (elong ?? 1);
    const uy = Math.sin(a) * d * 0.42;
    const ca = Math.cos(angle ?? 0), sa = Math.sin(angle ?? 0);
    const x = cx + ux * ca - uy * sa;
    const y = cy + ux * sa + uy * ca;
    const r = between(spread * 0.16, spread * 0.46);
    const w = keepoutWeight(x / W, y / H);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, tint.replace('ALPHA', (alpha * (1 - w * 0.85)).toFixed(3)));
    g.addColorStop(1, tint.replace('ALPHA', '0'));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* The galaxy sweeping up the lower right, behind where Zoey stands. Two tints so the core reads
   warmer than its edges, the way a real one does. */
nebulaCloud(W * 1.06, H * 0.66, W * 0.44, 'rgba(150, 82, 232, ALPHA)', 0.105, 54, 44, -1.12, 1.35);
nebulaCloud(W * 1.08, H * 0.50, W * 0.30, 'rgba(216, 148, 255, ALPHA)', 0.090, 36, 36, -1.12, 1.20);
nebulaCloud(W * 1.06, H * 0.90, W * 0.26, 'rgba(112, 58, 198, ALPHA)', 0.070, 26, 40, -0.92, 1.10);
/* A cooler, thinner arm reaching up the right edge. */
nebulaCloud(W * 1.08, H * 0.26, W * 0.24, 'rgba(126, 104, 248, ALPHA)', 0.060, 24, 38, -1.25, 1.25);
/* A faint counterweight low-left so the composition is not one-sided. */
nebulaCloud(W * 0.08, H * 0.98, W * 0.24, 'rgba(88, 46, 166, ALPHA)', 0.018, 16, 46, 0.55, 1.10);

/*
 * THE BRIGHT ARM.
 *
 * The mockup's galaxy is not only a broad haze -- it has one narrow, distinctly brighter streak
 * running up the right edge, near-white at its core. Without it the right side reads as fog rather
 * than as a galaxy seen edge-on.
 */
(function brightArm() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.filter = 'blur(16px)';
  const cx = W * 1.00, cy = H * 0.60, ang = -1.16;
  for (let i = 0; i < 26; i += 1) {
    const t = (i / 25 - 0.5) * 2;
    const d = t * W * 0.40;
    const x = cx + Math.cos(ang) * d;
    const y = cy + Math.sin(ang) * d;
    const r = (1 - Math.abs(t) * 0.72) * W * 0.075;
    const a = (1 - Math.abs(t)) * 0.30;
    if (r <= 0 || a <= 0) continue;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(238, 214, 255, ${a.toFixed(3)})`);
    g.addColorStop(0.5, `rgba(196, 132, 250, ${(a * 0.45).toFixed(3)})`);
    g.addColorStop(1, 'rgba(150, 90, 230, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
})();

/* ------------------------------------------------------------------ 3. dust
 * Fine glowing motes. Small, many, and mostly where the nebula already is -- dust is lit by
 * something, so scattering it evenly across the frame would look like noise instead of matter.
 */
ctx.save();
ctx.globalCompositeOperation = 'lighter';
for (let i = 0; i < 300; i += 1) {
  const biasRight = Math.pow(rand(), 0.55);
  const nx = 0.12 + biasRight * 0.95;
  const ny = between(0.04, 1.0);
  const x = nx * W, y = ny * H;
  if (x > W || y > H) continue;
  const w = keepoutWeight(nx, ny);
  const r = between(0.4, 1.3);
  const a = between(0.04, 0.16) * (1 - w * 0.9);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
  g.addColorStop(0, `rgba(226, 200, 255, ${a.toFixed(3)})`);
  g.addColorStop(1, 'rgba(226, 200, 255, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r * 4, 0, Math.PI * 2);
  ctx.fill();
}
ctx.restore();

/* ------------------------------------------------------------------ 4. stars
 * Dense but controlled. Size and brightness are power-law distributed so the field is mostly faint
 * pinpricks with a few genuinely bright ones, which is what stops it reading as scattered dots.
 */
ctx.save();
ctx.globalCompositeOperation = 'lighter';
const STAR_TINTS = [
  [255, 255, 255], [232, 220, 255], [255, 240, 250],
  [206, 214, 255], [246, 226, 255],
];
for (let i = 0; i < 1450; i += 1) {
  const nx = rand(), ny = rand();
  const x = nx * W, y = ny * H;
  const w = keepoutWeight(nx, ny);
  const mag = Math.pow(rand(), 3.1);
  const r = 0.30 + mag * 1.05;
  const a = (0.11 + mag * 0.95) * (1 - w * 0.50);
  const t = STAR_TINTS[(rand() * STAR_TINTS.length) | 0];
  ctx.fillStyle = `rgba(${t[0]},${t[1]},${t[2]},${a.toFixed(3)})`;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  /* The brightest few get a halo and a cross glint. */
  if (mag > 0.955) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 6);
    g.addColorStop(0, `rgba(${t[0]},${t[1]},${t[2]},${(a * 0.32).toFixed(3)})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r * 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,${(a * 0.30).toFixed(3)})`;
    ctx.lineWidth = 0.7;
    const L = r * 7;
    ctx.beginPath();
    ctx.moveTo(x - L, y); ctx.lineTo(x + L, y);
    ctx.moveTo(x, y - L); ctx.lineTo(x, y + L);
    ctx.stroke();
  }
}
ctx.restore();

/* ------------------------------------------------------------------ 5. orbital arcs
 * Wide, very faint ellipse segments. They sit in the upper right with the planet and never sweep
 * across the copy -- an arc drawn over the score reads as a scratch, not as distance.
 */
function arc(cx, cy, rx, ry, rot, alpha, lw) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.strokeStyle = `rgba(198, 168, 255, ${alpha})`;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}
arc(W * 0.80, H * 0.16, W * 0.40, H * 0.22, -0.32, 0.10, 1.1);
arc(W * 0.86, H * 0.10, W * 0.30, H * 0.15, -0.22, 0.07, 0.9);
arc(W * 0.30, H * 1.02, W * 0.52, H * 0.26, 0.18, 0.05, 1.0);

/* ------------------------------------------------------------------ 6. planets
 * A sphere is a lit ball, a terminator, a rim light and a texture. The old version had a flat
 * radial fill and two darker circles for craters, which is why it read as a translucent disc.
 */
function planet(cx, cy, r, opts) {
  const { base, lit, lightAngle, atmosphere, bands, craters, alpha } = opts;
  ctx.save();
  ctx.globalAlpha = alpha;

  /* atmosphere halo */
  const halo = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 1.5);
  halo.addColorStop(0, atmosphere.replace('ALPHA', '0.28'));
  halo.addColorStop(1, atmosphere.replace('ALPHA', '0'));
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(cx, cy, r * 1.5, 0, Math.PI * 2); ctx.fill();

  /* body, lit from lightAngle */
  const lx = cx + Math.cos(lightAngle) * r * 0.55;
  const ly = cy + Math.sin(lightAngle) * r * 0.55;
  const body = ctx.createRadialGradient(lx, ly, r * 0.05, cx, cy, r * 1.12);
  body.addColorStop(0, lit);
  body.addColorStop(0.55, base);
  body.addColorStop(1, '#05030B');
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = body;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

  /* surface: banding plus craters, all clipped inside the disc */
  ctx.globalCompositeOperation = 'overlay';
  for (let i = 0; i < bands; i += 1) {
    const by = cy - r + (r * 2 * (i + 0.5)) / bands + between(-r * 0.05, r * 0.05);
    ctx.fillStyle = `rgba(${i % 2 ? '255,255,255' : '0,0,0'},${between(0.03, 0.10).toFixed(3)})`;
    ctx.beginPath();
    ctx.ellipse(cx + between(-r * 0.2, r * 0.2), by, r * between(0.7, 1.05), r * between(0.05, 0.13), 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  for (let i = 0; i < craters; i += 1) {
    const a = between(0, Math.PI * 2);
    const d = Math.pow(rand(), 0.5) * r * 0.86;
    const px = cx + Math.cos(a) * d, py = cy + Math.sin(a) * d * 0.95;
    const pr = between(r * 0.04, r * 0.13);
    const cg = ctx.createRadialGradient(px - pr * 0.3, py - pr * 0.3, 0, px, py, pr);
    cg.addColorStop(0, 'rgba(255,255,255,0.10)');
    cg.addColorStop(0.6, 'rgba(0,0,0,0.16)');
    cg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
  }

  /* terminator: the unlit crescent */
  const term = ctx.createLinearGradient(
    cx - Math.cos(lightAngle) * r, cy - Math.sin(lightAngle) * r,
    cx + Math.cos(lightAngle) * r, cy + Math.sin(lightAngle) * r
  );
  term.addColorStop(0, 'rgba(3,1,8,0.80)');
  term.addColorStop(0.5, 'rgba(3,1,8,0.16)');
  term.addColorStop(1, 'rgba(3,1,8,0)');
  ctx.fillStyle = term;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  ctx.restore();

  /* rim light on the lit limb */
  ctx.strokeStyle = atmosphere.replace('ALPHA', '0.5');
  ctx.lineWidth = Math.max(0.8, r * 0.02);
  ctx.beginPath();
  ctx.arc(cx, cy, r, lightAngle - 1.25, lightAngle + 1.25);
  ctx.stroke();
  ctx.restore();
}

/* Upper right, matching the reference's placement. Large enough to carry surface detail. */
planet(W * 0.885, H * 0.145, W * 0.098, {
  base: '#2A1852', lit: '#9E86D8', lightAngle: -2.35,
  atmosphere: 'rgba(206, 176, 255, ALPHA)', bands: 7, craters: 16, alpha: 1.0,
});
/* A smaller, dimmer companion low on the right, mostly lost in the nebula. */
planet(W * 0.62, H * 0.965, W * 0.052, {
  base: '#2A1550', lit: '#8A6ECB', lightAngle: -2.0,
  atmosphere: 'rgba(170, 138, 240, ALPHA)', bands: 5, craters: 8, alpha: 0.55,
});

/* ------------------------------------------------------------------ 7. vignette
 * Pulls the corners down so the card's own edges are not the brightest thing in the frame.
 */
const vig = ctx.createRadialGradient(W * 0.55, H * 0.5, Math.min(W, H) * 0.28, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
vig.addColorStop(0, 'rgba(0,0,0,0)');
vig.addColorStop(1, 'rgba(3,1,9,0.62)');
ctx.fillStyle = vig;
ctx.fillRect(0, 0, W, H);

/*
 * The floor, where the bureau selector sits.
 *
 * The nebula's brightest mass is low-right, and the selector is a glass bar laid straight over it --
 * with the cloud at full strength the unselected bureau values were reading against a lit purple
 * haze instead of against dark glass. Darkening the bottom band keeps the environment visible
 * through the bar while giving the values something to sit on.
 */
const floor = ctx.createLinearGradient(0, H * 0.62, 0, H);
floor.addColorStop(0, 'rgba(5,2,12,0)');
floor.addColorStop(0.55, 'rgba(5,2,12,0.38)');
floor.addColorStop(1, 'rgba(4,2,10,0.72)');
ctx.fillStyle = floor;
ctx.fillRect(0, H * 0.62, W, H * 0.38);

window.__cosmos = { w: W, h: H };
document.documentElement.setAttribute('data-ready', '1');
</script>
